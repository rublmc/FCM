<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Nicht in Suchmaschinen aufnehmen -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="referrer" content="no-referrer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FC Manager - Retro Edition</title>
    <link rel="icon" type="image/png" href="logo.png?v=31.0">
    <link rel="apple-touch-icon" href="logo.png?v=31.0">
    <script>try{var __t=localStorage.getItem('fcm_theme');if(__t)document.documentElement.setAttribute('data-theme',__t);}catch(e){}</script>
    <link rel="stylesheet" href="style.css?v=31.0">
</head>
<body>
    <div id="app-container">
        <!-- Kopfzeile mit Safe-Area für iPhone Dynamic Island -->
        <header class="bmh-header">
            <div class="header-top-row">
                <div class="header-left">
                    <img src="logo.png?v=31.0" alt="FC Manager Logo" class="header-logo">
                    <div class="club-title-wrap">
                        <h1 id="header-club-name">KEIN VEREIN</h1>
                        <span id="header-league-info" class="sub-info">Bitte Update laden</span>
                    </div>
                </div>
                <div class="header-right">
                    <div id="header-date-box" class="stat-box" style="cursor:pointer;" title="Kalender öffnen">
                        <span id="header-phase-label" class="label">DATUM</span>
                        <span id="header-date" class="value">26/27 | W1</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">BUDGET</span>
                        <span id="header-budget" class="value money">0 €</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Vertikal scrollbarer Hauptbereich -->
        <main id="main-viewport" class="bmh-panel">
            <!-- Inhalte werden dynamisch von den Spiel-Modulen gerendert -->
        </main>

        <!-- Fixierter unterer Bereich: Status/Weiter-Button + Schnellzugriff (alle Bereiche im 🏠 MENÜ) -->
        <div class="bmh-bottom-dock">
            <div class="bmh-footer">
                <span id="status-message">Bereit (v1.21.0)</span>
                <button id="btn-next-day" class="bmh-btn primary small-btn">WEITER ▶</button>
            </div>

            <nav class="bmh-nav">
                <button class="nav-btn nav-home active" data-view="menu"><span class="nav-icon">🏠</span><span>MENÜ</span></button>
                <button class="nav-btn" data-view="office"><span class="nav-icon">🏢</span><span>BÜRO</span></button>
                <button class="nav-btn" data-view="tactics"><span class="nav-icon">📋</span><span>TAKTIK</span></button>
                <button class="nav-btn" data-view="training"><span class="nav-icon">🏋️</span><span>TRAINING</span></button>
                <button class="nav-btn" data-view="league"><span class="nav-icon">📊</span><span>TABELLE</span></button>
            </nav>
        </div>
    </div>

    <script>
        window.FCM_SCRIPT_ERROR = null;
        window.FCM_NETWORK_ERROR = null;
        window.addEventListener('error', function(ev) {
            window.FCM_SCRIPT_ERROR = (ev.message || 'JS-Fehler') + (ev.filename ? ' in ' + ev.filename.split('/').pop() : '') + (ev.lineno ? ' (Zeile ' + ev.lineno + ')' : '');
            var st = document.getElementById('status-message');
            if (st) st.textContent = 'Fehler: ' + window.FCM_SCRIPT_ERROR;
        });
    </script>
    <script src="storage.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'storage.js';"></script>
    <script src="settings.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'settings.js';"></script>
    <script src="crowd.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'crowd.js';"></script>
    <script src="sound.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'sound.js';"></script>
    <script src="data.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'data.js';"></script>
    <script src="engine.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'engine.js';"></script>
    <script src="world.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'world.js';"></script>
    <script src="negotiation.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'negotiation.js';"></script>
    <script src="cups.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'cups.js';"></script>
    <script src="life.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'life.js';"></script>
    <script src="transfers.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'transfers.js';"></script>
    <script src="loans.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'loans.js';"></script>
    <script src="stadium.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'stadium.js';"></script>
    <script src="stadium3d.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'stadium3d.js';"></script>
    <script src="finance.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'finance.js';"></script>
    <script src="grades.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'grades.js';"></script>
    <script src="interview.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'interview.js';"></script>
    <script src="coach.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'coach.js';"></script>
    <script src="motivation.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'motivation.js';"></script>
    <script src="skills.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'skills.js';"></script>
    <script src="training.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'training.js';"></script>
    <script src="trainer.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'trainer.js';"></script>
    <script src="intl_data.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'intl_data.js';"></script>
    <script src="intl.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'intl.js';"></script>
    <script src="calendar.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'calendar.js';"></script>
    <script src="league.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'league.js';"></script>
    <script src="liveticker_engine.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'liveticker_engine.js';"></script>
    <script src="liveticker_ui.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'liveticker_ui.js';"></script>
    <script src="squad.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'squad.js';"></script>
    <script src="tactics.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'tactics.js';"></script>
    <script src="menu.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'menu.js';"></script>
    <script src="club.js?v=31.0" onerror="window.FCM_NETWORK_ERROR = 'club.js';"></script>
    <script>
        if (!window.FCM_APP_LOADED) {
            var vp = document.getElementById('main-viewport');
            var reason = window.FCM_NETWORK_ERROR
                ? 'Netzwerk/404-Fehler beim Laden von <code>' + window.FCM_NETWORK_ERROR + '</code> (stelle sicher, dass alle 33 JS-Module im Hauptverzeichnis von GitHub liegen).'
                : (window.FCM_SCRIPT_ERROR
                    ? 'JavaScript-Syntax-/Laufzeitfehler: <strong>' + window.FCM_SCRIPT_ERROR + '</strong>'
                    : 'Ein Modul wurde nicht vollständig ausgeführt (möglicherweise beschädigte/abgeschnittene Datei auf GitHub).');
            if (vp) {
                vp.innerHTML = '<div class="bmh-box" style="border-color:#a82424; background:#ffe3e3; color:#111;">' +
                    '<h3 style="color:#a82424;">⚠️ DIAGNOSE: SPIELMODULE NICHT VOLLSTÄNDIG AKTIV</h3>' +
                    '<p style="font-size:0.78rem; margin-top:6px;">' + reason + '</p>' +
                    '<p style="font-size:0.74rem; margin-top:8px;">Prüfe auf GitHub unter <strong>rublmc/FCM</strong>, ob alle Dateien aus dem ZIP im Main-Ordner hochgeladen wurden.</p>' +
                    '<button onclick="location.href=\'start.html\'" class="bmh-btn primary" style="width:100%; margin-top:10px;">◀ ZURÜCK ZUM STARTBILDSCHIRM</button>' +
                    '</div>';
            }
        }
    </script>
</body>
</html>
