<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FC Manager - Retro Edition</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css?v=11.8">
</head>
<body>
    <div id="app-container">
        <!-- Kopfzeile mit Safe-Area für iPhone Dynamic Island -->
        <header class="bmh-header">
            <div class="header-top-row">
                <div class="header-left">
                    <span class="club-badge">⚽</span>
                    <div class="club-title-wrap">
                        <h1 id="header-club-name">KEIN VEREIN</h1>
                        <span id="header-league-info" class="sub-info">Bitte Update laden</span>
                    </div>
                </div>
                <div class="header-right">
                    <div id="header-date-box" class="stat-box" style="cursor:pointer;" title="Kalender öffnen">
                        <span id="header-phase-label" class="label">SAISON / VORB.</span>
                        <span id="header-date" class="value">26/27 | W1</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">BUDGET</span>
                        <span id="header-budget" class="value money">0 €</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Vertikal scrollbarer Hauptbereich -->
        <main id="main-viewport" class="bmh-panel">
            <!-- Inhalte werden dynamisch von app.js gerendert -->
        </main>

        <!-- Fixierter unterer Bereich: Status/Weiter-Button + 9 Kacheln nebeneinander -->
        <div class="bmh-bottom-dock">
            <div class="bmh-footer">
                <span id="status-message">Bereit (v1.1.8)</span>
                <button id="btn-next-day" class="bmh-btn primary small-btn">WEITER ▶</button>
            </div>

            <nav class="bmh-nav">
                <button class="nav-btn active" data-view="office"><span class="nav-icon">🏢</span><span>BÜRO</span></button>
                <button class="nav-btn" data-view="calendar"><span class="nav-icon">📅</span><span>KAL.</span></button>
                <button class="nav-btn" data-view="squad"><span class="nav-icon">👥</span><span>KADER</span></button>
                <button class="nav-btn" data-view="tactics"><span class="nav-icon">📋</span><span>TAKTIK</span></button>
                <button class="nav-btn" data-view="contracts"><span class="nav-icon">✍️</span><span>VERTR.</span></button>
                <button class="nav-btn" data-view="sponsors"><span class="nav-icon">💼</span><span>SPONS.</span></button>
                <button class="nav-btn" data-view="stadium"><span class="nav-icon">🏟️</span><span>STAD.</span></button>
                <button class="nav-btn" data-view="league"><span class="nav-icon">🏆</span><span>TAB.</span></button>
                <button class="nav-btn admin-btn" data-view="admin"><span class="nav-icon">⚙️</span><span>ADMIN</span></button>
            </nav>
        </div>
    </div>

    <script>
        window.FCM_SCRIPT_ERROR = null;
        window.addEventListener('error', function(ev) {
            window.FCM_SCRIPT_ERROR = (ev.message || 'JS-Fehler') + (ev.lineno ? ' (Zeile ' + ev.lineno + ')' : '');
            var st = document.getElementById('status-message');
            if (st) st.textContent = 'Fehler: ' + window.FCM_SCRIPT_ERROR;
        });
    </script>
    <script src="app.js?v=11.8" onerror="window.FCM_NETWORK_ERROR = true;"></script>
    <script>
        if (!window.FCM_APP_LOADED) {
            var vp = document.getElementById('main-viewport');
            var reason = window.FCM_NETWORK_ERROR
                ? 'Netzwerk/404-Fehler beim Laden von <code>app.js</code> (GitHub Pages liefert die Datei unter <code>' + location.href + '</code> noch nicht aus oder sie ist 0 Bytes groß).'
                : (window.FCM_SCRIPT_ERROR
                    ? 'JavaScript-Syntax-/Laufzeitfehler in <code>app.js</code>: <strong>' + window.FCM_SCRIPT_ERROR + '</strong>'
                    : '<code>app.js</code> wurde nicht vollständig ausgeführt (möglicherweise beschädigte/abgeschnittene Datei auf GitHub).');
            if (vp) {
                vp.innerHTML = '<div class="bmh-box" style="border-color:#a82424; background:#ffe3e3; color:#111;">' +
                    '<h3 style="color:#a82424;">⚠️ DIAGNOSE: app.js NICHT AKTIV</h3>' +
                    '<p style="font-size:0.78rem; margin-top:6px;">' + reason + '</p>' +
                    '<p style="font-size:0.74rem; margin-top:8px;">Prüfe auf GitHub unter <strong>rublmc/FCM → app.js</strong>, ob oben <strong>247 KB / 5910 lines</strong> steht (nicht 0 Bytes).</p>' +
                    '<button onclick="location.href=\'start.html\'" class="bmh-btn primary" style="width:100%; margin-top:10px;">◀ ZURÜCK ZUM STARTBILDSCHIRM</button>' +
                    '</div>';
            }
        }
    </script>
</body>
</html>
